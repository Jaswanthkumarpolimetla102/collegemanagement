			 <!-- login area start -->
			 <section class="atf-login__area atf-section-padding">
				<div class="container">
				   <div class="atf-login__inner p-relative z-index-1">
					  <div class="row justify-content-center">
						 <div class="col-xl-6 col-lg-8 col-md-10">
							<div class="atf-login__wrapper">
							   <div class="atf-login__top mb-4 text-center">
								  <h3 class="atf-login__title">Register Now!</h3>
								  <p>You can signup with you social account below</p>
							   </div>
							   <div class="atf-login__form">
								  <form action="/signup" method="GET">
									 <div class="atf-login__input-wrapper">
										<div class="atf-login__input-item">
										   <div class="atf-login__input">
											  <input name="user" type="text" placeholder="Enter your username" required="" pattern="[A-Za-z].{5,}" title="Five or more combi of uppercase & lowercase letter req.">
											  <span>
												<i class="fa-regular fa-user"></i>                                         
											  </span>
										   </div>
										</div>
										<div class="atf-login__input-item">
											<div class="atf-login__input">
											   <input name="name" type="text" placeholder="Enter your Name" required>
											   <span>
												 <i class="fa-regular fa-user"></i>                                         
											   </span>
											</div>
										 </div>
										<div class="atf-login__input-item">
										   <div class="atf-login__input">
											  <input name="email" type="text" placeholder="Enter your email" required="" pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$">
											  <span>
													<i class="fa-regular fa-envelope"></i>                                       
												</span>
										   </div>
										</div>
										<div class="atf-login__input-item">
											<div class="atf-login__input">
											   <input name="mobile" type="text" placeholder="Enter your Mobile" required=""  pattern="[6-9]{1}[0-9]{9}" title="Phone number with 7-9 and remaing 9 digit with 0-9">
											   <span>
													 <i class="fa-regular fa-envelope"></i>                                       
												 </span>
											</div>
										 </div>
										<div class="atf-login__input-item">
										   <div class="atf-login__input">
											  <input type="password" name="password" placeholder="Password" required="" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one  number and one uppercase and lowercase letter, and at least 8 or more characters">
											   <span>
													<i class="fa-solid fa-lock"></i>
												</span>
										   </div>
											<span>
												 <i class="fa-regular fa-eye-slash"></i>  
											</span>
										</div>
										
									 </div>
									 <div class="atf-login__option mb-4 d-sm-flex justify-content-between">
										<div class="login__remember">
										   <input type="checkbox" id="atf-remember">
										   <label for="atf-remember">Remember me</label>
										</div>
									 </div>
									 <div class="atf-login__btn mt-4">
										<button type="submit" class="atf-themes-btn w-100"><span>Sign Up</span></button>
									 </div>
								  </form>
								  <div class="atf-login__social text-center">
									 <h3 class="atf-login__social-header">Or Sign in with</h3>
									 
									 <div class="atf-login__social-item d-flex flex-wrap justify-content-sm-center">
										<a href="#">
